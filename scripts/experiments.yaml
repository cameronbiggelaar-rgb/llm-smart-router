# Experiments — directing production traffic to a candidate model.
#
# This file is the ONLY interface needed to test a new model against production.
# Edit it and the endpoint hot-reloads it (no restart, no code change).
#
#   shadow  — production serves the control answer unchanged. The candidate is
#             ALSO called on the real payload; its cost/latency/quality are
#             logged and its output discarded. Real load, zero user risk.
#             Always start here.
#   split   — `percent` of matching traffic is actually SERVED by the candidate.
#             This changes what users receive; promote to it only after shadow
#             evidence looks good.
#
# Arm assignment is a stable hash of the session id, so a session never flaps
# between models mid-conversation.
#
# Fields:
#   name             unique label, recorded on every affected router_logs row
#   enabled          true/false — false disables without deleting
#   model            the candidate's registered model name
#   mode             shadow | split
#   percent          0-100, honoured for `split`; ignored for `shadow`
#   match.workload   workload_type values to match ([] = all)
#   match.min_tier   only apply when the routed tier is at least this
#   match.requires_tools   true → only tool-bearing requests (requires_tools=1)
#   match.incumbent_model  non-empty → only requests whose routed model is this
#
# NOTE: the candidate must be registered in MODEL_REGISTRY and reachable via a
# configured backend. An experiment naming an unknown model is skipped, never
# half-applied.

experiments:
  # Observational test of glm-5.3-flash on real compression payloads.
  # Rationale: glm-5.3-flash is priced identically to deepseek-v4.1-flash on
  # input and cheaper on output, but was measured slower and more verbose in the
  # offline A/B. Shadow gives real-load numbers before any traffic is moved.
  - name: glm53flash-compression-shadow
    enabled: false
    started: '2026-09-12'
    model: glm-5.3-flash
    # The candidate is deliberately NOT in the production fallback chain.
    # Adding it there to make this experiment work could start serving real
    # traffic — exactly what shadow exists to avoid — so the experiment
    # declares its own provider instead.
    provider: ollama-cloud
    mode: shadow
    match:
      workload: [session_compression]
    notes: >
      Measure cost/latency/quality of glm-5.3-flash vs the incumbent
      deepseek-v4.1-flash on production compressions. Output discarded.

  # Deliberate promotion step — moves 10% of compressions onto the candidate.
  # Keep disabled until shadow evidence supports it.
  - name: glm53flash-compression-split
    enabled: false
    model: glm-5.3-flash
    mode: split
    percent: 10
    match:
      workload: [session_compression]
    notes: >-
      Serve 10% of session compression from glm-5.3-flash. Requires shadow
      evidence and explicit approval before enabling.

  # Observe deepseek-v4.1-flash on real tool-bearing payloads currently routed
  # to deepseek-v4-pro. The probe (probe_tool_calling_ollama.py) measured
  # 100% structured tool-calling with valid JSON args and clean finish_reason
  # for flash, so shadow gives real-load confirmation before ANY tool traffic
  # is moved off pro. Keep disabled until shadow evidence is reviewed.
  - name: v41flash-tool-shadow
    enabled: false
    model: deepseek-v4.1-flash
    provider: ollama-cloud
    mode: shadow
    match:
      workload: [normal_chat]
      requires_tools: true
      incumbent_model: deepseek-v4-pro
    notes: >-
      Shadow deepseek-v4.1-flash on tool-bearing normal_chat that would be
      served by deepseek-v4-pro. Output discarded; no traffic moves until a
      split experiment is separately enabled.

  # Streaming twin of v41flash-tool-shadow (B35). The non-streamed arm forces
  # stream=False, which suppresses the provider's prompt cache: flash logs 0
  # cached tokens on every call, so its measured cost is the FULL input rate
  # and it looks MORE expensive than pro (which is ~94% cache hits when
  # streamed). This arm streams the candidate so it hits the prompt cache, and
  # records real cached_tokens + a cost at the discounted cached rate. It also
  # re-tests whether flash's tool choice improves when streamed.
  - name: v41flash-tool-shadow-streaming
    enabled: false
    model: deepseek-v4.1-flash
    provider: ollama-cloud
    mode: shadow
    stream: true
    match:
      workload: [normal_chat]
      requires_tools: true
      incumbent_model: deepseek-v4-pro
    notes: >-
      Streaming shadow of deepseek-v4.1-flash on tool-bearing normal_chat
      served by deepseek-v4-pro. Measures true streamed cached_tokens and
      cached-rate cost; output discarded; no traffic moves.

  # Served split canary (B36) — moves a bounded slice of tool-bearing
  # normal_chat OFF deepseek-v4-pro and ONTO deepseek-v4.1-flash for real.
  # Flash is ~3x cheaper streamed at the same cache rate (proven B35), so this
  # is the first actual savings step. Scoped conservatively:
  #   * 10% of eligible requests (stable session hash)
  #   * only qa/research/planning/other — debugging/coding/testing stay on pro
  #   * a flash miss escalates to deepseek-v4-pro (fallback_model), NEVER the
  #     scarce ChatGPT plan (gpt-5.5/5.6)
  # Keep DISABLED until go/no-go is explicit. Flip enabled:true (hot-reloaded)
  # to start; flip back to roll back — no code revert needed.
  - name: v41flash-tool-canary
    enabled: true
    model: deepseek-v4.1-flash:cloud
    provider: ollama-cloud
    mode: split
    percent: 50
    fallback_model: deepseek-v4-pro
    match:
      workload: [normal_chat]
      requires_tools: true
      incumbent_model: deepseek-v4-pro
      exclude_task_type: [debugging, testing]
    notes: >-
      Serve 50% of tool-bearing normal_chat from deepseek-v4.1-flash.
      Excludes debugging/testing; coding included (B36a widen) for faster
      signal. Flash miss escalates to pro.
